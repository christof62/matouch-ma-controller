; Music Assistant Controller for MaTouch ESP32-S3 RotaryIPS-Display1.28" (GC9A01)
; Board: Makerfabs MTRO128G (ESP32-S3, 16MB Flash, 8MB PSRAM)
; Build:  pio run          (firmware)
; Upload: pio run -t upload
; SPIFFS: pio run -t uploadfs

[env:matouch_esp32s3_rotary_128]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; keep RTS/DTR untouched when the monitor opens, otherwise the ESP32-S3
; gets reset into download mode / output stays blocked
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial defaults to the USB-Serial/JTAG peripheral on this core (COM port),
    ; no CDC flags needed (they break Serial on this framework version)
    ; WiFiManager fixes for ESP32-S3
    -DWM_NODEBUG
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    ; App config
    -DCORE_DEBUG_LEVEL=1
    -DGC9A01_SPI_FREQ=40000000

lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.3.1
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/madhephaestus/ESP32Encoder.git
    https://github.com/links2004/arduinoWebSockets.git
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; ---------------------------------------------------------------
; MINIMAL SERIAL TEST - flash this to debug the monitor problem:
;   pio run -e serialtest -t upload
;   pio device monitor
; Prints a banner + a counter once per second. If you see nothing,
; the issue is USB/cable/port, not our app code.
; ---------------------------------------------------------------
[env:serialtest]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DCORE_DEBUG_LEVEL=1
src_filter = +<../serialtest>
